<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>অজানা গল্প</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&family=Noto+Serif+Bengali:wght@800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#120e1c;--bg2:#1c1630;--ink:#f4eefb;--muted:#a99fc0;--peach:#ffb38a;--ice:#bfe6ff;--line:rgba(255,255,255,.14);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#fbf6ef;--bg2:#fff;--ink:#1d1530;--muted:#6a5f80;--peach:#d9622b;--ice:#2b6aa3;--line:rgba(0,0,0,.14)}}
:root[data-theme="light"]{--bg:#fbf6ef;--bg2:#fff;--ink:#1d1530;--muted:#6a5f80;--peach:#d9622b;--ice:#2b6aa3;--line:rgba(0,0,0,.14)}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hind Siliguri",system-ui,sans-serif;line-height:1.75;overflow-x:hidden}
.spot{position:fixed;inset:0;pointer-events:none;background:radial-gradient(420px circle at var(--x,50%) var(--y,20%),rgba(255,179,138,.16),transparent 70%);z-index:0}
section,header{position:relative;z-index:1;max-width:1040px;margin:0 auto;padding:0 20px}
.hero{min-height:88vh;min-height:88svh;display:flex;flex-direction:column;justify-content:center;padding-top:40px;padding-bottom:30px}
.tag{display:inline-flex;align-items:center;gap:8px;align-self:flex-start;border:1px solid var(--line);border-radius:99px;padding:4px 14px;font-size:14px;color:var(--muted)}
.tag i{width:8px;height:8px;border-radius:50%;background:var(--peach);animation:blink 1.3s infinite}
@keyframes blink{50%{opacity:.2}}
h1{font-family:"Noto Serif Bengali",serif;font-weight:900;font-size:clamp(42px,11vw,112px);line-height:1.12;margin:18px 0 12px;letter-spacing:-1px}
h1 em{font-style:normal;color:var(--peach)}
.lead{font-size:clamp(18px,3vw,24px);color:var(--muted);max-width:620px;margin:0 0 28px}
.go{align-self:flex-start;font:inherit;font-weight:700;font-size:18px;color:var(--bg);background:var(--ice);border:0;border-radius:14px;padding:14px 26px;cursor:pointer;transition:transform .25s,box-shadow .25s}
.go:hover{transform:translateY(-3px);box-shadow:0 14px 30px -10px var(--ice)}
.scroll{margin-top:34px;color:var(--muted);font-size:14px;animation:bob 2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(8px)}}
h2{font-family:"Noto Serif Bengali",serif;font-weight:800;font-size:clamp(26px,5vw,42px);margin:0 0 6px;line-height:1.3}
.sec{padding-top:56px;padding-bottom:10px}
.sub{color:var(--muted);margin:0 0 22px}
/* gallery */
.rail{display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;padding:6px 20px 22px;margin:0 -20px;scrollbar-width:thin}
.card{flex:0 0 min(260px,68vw);aspect-ratio:3/4;scroll-snap-align:center;border-radius:20px;overflow:hidden;position:relative;border:1px solid var(--line);cursor:zoom-in;background:var(--bg2);transition:transform .45s cubic-bezier(.2,.8,.2,1),box-shadow .45s}
.card:nth-child(odd){transform:rotate(-1.6deg)}.card:nth-child(even){transform:rotate(1.4deg) translateY(10px)}
.card:hover{transform:rotate(0) translateY(-10px) scale(1.04);box-shadow:0 26px 40px -18px rgba(0,0,0,.6)}
.card img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .8s}
.card:hover img{transform:scale(1.08)}
.card span{position:absolute;left:12px;bottom:10px;font-weight:600;font-size:15px;color:#fff;text-shadow:0 2px 8px #000}
.card::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 55%,rgba(0,0,0,.65));pointer-events:none}
.del{position:absolute;top:8px;right:8px;z-index:2;width:30px;height:30px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;cursor:pointer;font-size:16px;opacity:0;transition:opacity .25s}
.card:hover .del,.del:focus-visible{opacity:1}
.add{flex:0 0 min(200px,52vw);aspect-ratio:3/4;scroll-snap-align:center;border:2px dashed var(--line);border-radius:20px;background:none;color:var(--muted);font:inherit;cursor:pointer;display:grid;place-content:center;gap:6px;text-align:center;transition:border-color .3s,color .3s,transform .3s}
.add:hover{border-color:var(--peach);color:var(--peach);transform:translateY(-6px)}
.add b{font-size:44px;line-height:1;font-weight:400}
/* secrets */
.secrets{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.sk{position:relative;border:1px solid var(--line);border-radius:20px;padding:22px;background:var(--bg2);min-height:170px;cursor:pointer;overflow:hidden;transition:transform .3s,border-color .3s;font:inherit;color:inherit;text-align:left}
.sk:hover{transform:translateY(-5px);border-color:var(--peach)}
.sk .txt{filter:blur(9px);transition:filter .7s;user-select:none}
.sk .lock{position:absolute;inset:0;display:grid;place-content:center;text-align:center;font-weight:700;gap:4px;background:linear-gradient(135deg,rgba(255,179,138,.12),rgba(191,230,255,.12));transition:opacity .5s}
.sk .lock span{font-size:34px;animation:wob 2.4s ease-in-out infinite}
@keyframes wob{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg) scale(1.12)}}
.sk.open{cursor:default;border-color:var(--ice)}
.sk.open .txt{filter:none}.sk.open .lock{opacity:0;pointer-events:none}
.prog{margin:18px 0 0;color:var(--muted)}
.meter{height:6px;border-radius:9px;background:var(--line);margin-top:8px;overflow:hidden}
.meter b{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--peach),var(--ice));transition:width .8s cubic-bezier(.2,.8,.2,1)}
/* poll */
.poll{text-align:center;padding:60px 20px 80px}
.btns{display:flex;gap:18px;justify-content:center;flex-wrap:wrap;margin-top:22px}
.big{position:relative;overflow:hidden;font:inherit;font-weight:700;font-size:21px;padding:20px 40px;min-width:240px;border:0;border-radius:20px;cursor:pointer;color:#1b1020;transition:transform .2s,box-shadow .3s;-webkit-tap-highlight-color:transparent}
.big.a{background:linear-gradient(120deg,#ffd2b5,var(--peach));box-shadow:0 0 0 0 rgba(255,179,138,.6);animation:ring 2.2s infinite}
.big.b{background:linear-gradient(120deg,#e2f3ff,var(--ice));animation:ring2 2.2s infinite .8s}
@keyframes ring{70%{box-shadow:0 0 0 22px rgba(255,179,138,0)}}
@keyframes ring2{70%{box-shadow:0 0 0 22px rgba(191,230,255,0)}}
.big::before{content:"";position:absolute;top:0;left:-70%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.7),transparent);transform:skewX(-20deg);animation:shine 3s ease-in-out infinite}
@keyframes shine{0%,55%{left:-70%}100%{left:150%}}
.big:hover{transform:scale(1.08) rotate(-1deg);animation:none}
.big:active{transform:scale(.94)}
.big:focus-visible,.go:focus-visible,.add:focus-visible,.sk:focus-visible{outline:3px solid var(--ice);outline-offset:3px}
.msg{min-height:34px;margin-top:20px;font-weight:700;font-size:20px;color:var(--peach)}
.msg.pop{animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{opacity:0;transform:scale(.7)}}
.bar{display:flex;height:12px;border-radius:99px;overflow:hidden;max-width:460px;margin:16px auto 8px;background:var(--line)}
.bar b{height:100%;transition:width .9s cubic-bezier(.2,.8,.2,1)}
.cnt{color:var(--muted);font-size:15px}
/* locked links */
.links{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.lk{position:relative;display:flex;align-items:center;gap:16px;padding:20px;border-radius:20px;border:2px dashed var(--line);background:var(--bg2);color:var(--muted);text-decoration:none;overflow:hidden;transition:transform .3s,box-shadow .3s}
.lk .ic{font-size:34px;width:56px;height:56px;border-radius:16px;display:grid;place-content:center;background:var(--line);flex:none}
.lk b{display:block;font-size:19px;color:var(--ink)}
.lk small{font-size:14px}
.lk:not(.on) .ic{animation:wob 2.4s ease-in-out infinite}
.lk.on{border:2px solid transparent;background:linear-gradient(var(--bg2),var(--bg2)) padding-box,linear-gradient(120deg,var(--peach),var(--ice)) border-box;color:var(--muted);cursor:pointer}
.lk.on .ic{background:linear-gradient(135deg,var(--peach),var(--ice));animation:none}
.lk.on::before{content:"";position:absolute;top:0;left:-70%;width:35%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.25),transparent);transform:skewX(-20deg);animation:shine 3.4s ease-in-out infinite}
a.lk.on:hover{transform:translateY(-6px) scale(1.03);box-shadow:0 20px 36px -16px var(--peach)}
.lk.fresh{animation:pop .7s cubic-bezier(.2,1.4,.4,1)}
a.lk:focus-visible{outline:3px solid var(--ice);outline-offset:3px}
.lk{padding:24px 22px}
.lk b{font-size:21px}
.lk:not(.on){border-color:var(--peach);background:linear-gradient(135deg,rgba(255,179,138,.1),rgba(191,230,255,.1)),var(--bg2)}
.lk.on:not(.fresh){animation:glow 2.2s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 0 6px rgba(255,179,138,.18),0 14px 34px -12px var(--peach)}}
.arr{margin-left:auto;flex:none;font-weight:700;font-size:15px;color:#1b1020;background:linear-gradient(120deg,var(--peach),var(--ice));padding:8px 14px;border-radius:99px;animation:nudge 1.2s ease-in-out infinite}
.arr:empty{display:none}
@keyframes nudge{50%{transform:translateX(6px)}}
.dock{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;max-width:calc(100vw - 28px);font:inherit;font-weight:700;font-size:16px;color:#1b1020;border:0;border-radius:99px;padding:14px 24px;cursor:pointer;background:linear-gradient(120deg,var(--peach),#ffd9c2 50%,var(--ice));box-shadow:0 14px 34px -8px rgba(255,179,138,.8);animation:dockb 1.8s ease-in-out infinite;transition:opacity .4s,visibility .4s}
.dock.hide{opacity:0;visibility:hidden;pointer-events:none}
.dock:hover{filter:brightness(1.08)}
.dock:focus-visible{outline:3px solid var(--ice);outline-offset:3px}
@keyframes dockb{50%{transform:translateX(-50%) translateY(-7px)}}
a.sk{display:block;text-decoration:none}
.sk{animation:glow 2.4s ease-in-out infinite}
.sk .lock div{font-size:20px;padding:0 12px;line-height:1.5}
.sk .lock small{background:linear-gradient(120deg,var(--peach),var(--ice));color:#1b1020;font-weight:700;font-size:14px;padding:4px 14px;border-radius:99px;margin-top:8px;animation:nudge 1.2s ease-in-out infinite}
/* লিংক ভিউয়ার (নতুন ট্যাব না খুললে এখানে খোলে) */
.vw{position:fixed;inset:0;z-index:150;background:var(--bg);display:none;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.vw.on{display:flex}
.vwb{display:flex;justify-content:space-between;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--bg2)}
.vwb a,.vwb button{font:inherit;font-weight:600;color:var(--ice);background:none;border:0;cursor:pointer;text-decoration:none}
.vw iframe{flex:1;width:100%;border:0;background:#fff}
/* lightbox */
.lb{position:fixed;inset:0;z-index:100;background:rgba(8,5,14,.92);display:none;place-items:center;padding:20px}
.lb.on{display:grid;animation:fade .3s}
@keyframes fade{from{opacity:0}}
.lb img{max-width:100%;max-height:86vh;border-radius:14px}
.lb button{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:16px;font-size:28px;background:none;border:0;color:#fff;cursor:pointer}
.confetti{position:fixed;left:0;top:0;width:10px;height:14px;pointer-events:none;z-index:200}
.rv{opacity:0;transform:translateY(26px);transition:opacity .8s,transform .8s cubic-bezier(.2,.8,.2,1)}
.rv.in{opacity:1;transform:none}
.hl{animation:up 1s cubic-bezier(.2,.8,.2,1) both}
@keyframes up{from{opacity:0;transform:translateY(30px)}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="spot" id="spot"></div>
<header class="hero">
  <span class="tag hl"><i></i><span id="tag"></span></span>
  <h1 class="hl" id="title"></h1>
  <p class="lead hl" id="lead"></p>
  <button class="go hl" id="go" type="button"></button>
  <div class="scroll">নিচে স্ক্রল করুন ↓</div>
</header>

<section class="sec rv" id="gal">
  <h2 id="galT"></h2>
  <p class="sub" id="galS"></p>
  <div class="rail" id="rail"></div>
  <input type="file" id="file" accept="image/*" multiple hidden>
</section>

<section class="sec rv">
  <h2 id="secT"></h2>
  <p class="sub" id="secS"></p>
  <div class="secrets" id="secrets"></div>
  <div class="prog"><span id="progT"></span><div class="meter"><b id="meter"></b></div></div>
</section>

<section class="sec rv" id="vip" style="padding-bottom:30px">
  <h2 id="lkT"></h2>
  <p class="sub" id="lkS"></p>
  <div class="links" id="links"></div>
</section>

<section class="poll rv" id="poll">
  <h2 id="q"></h2>
  <p class="sub" id="qs"></p>
  <div class="btns">
    <button class="big a" id="b1" type="button"></button>
    <button class="big b" id="b2" type="button"></button>
  </div>
  <div class="msg" id="msg" aria-live="polite"></div>
  <div class="bar"><b id="bg" style="background:var(--peach)"></b><b id="br" style="background:var(--ice)"></b></div>
  <div class="cnt" id="cnt"></div>
</section>

<button class="dock" id="dock" type="button"></button>

<div class="vw" id="vw"><div class="vwb"><a id="vwo" data-native href="#" target="_blank" rel="noopener noreferrer">↗ নতুন ট্যাবে খুলুন</a><button id="vwx" type="button">✕ বন্ধ করুন</button></div><iframe id="vwf" title="লিংক" referrerpolicy="no-referrer" allow="fullscreen"></iframe></div>

<div class="lb" id="lb"><button type="button" aria-label="বন্ধ করুন" id="lbx">✕</button><img id="lbi" alt=""></div>

<script>
/* ===== এখানে লেখা বদলান ===== */
const CONFIG = {
  tag: "একটি অজানা গল্প",
  title: ["এই মানুষটিকে কতটা", "চেনেন <em>আপনি?</em>"],
  lead: "সাদ ইসলাম নাফি, নাটরের এক সাধারণ মানুষ। কিন্তু তাঁর জীবনে লুকিয়ে আছে এমন কিছু, যা আপনাকে অবাক করবেই।",
  goLabel: "গল্পটা জানতে চাই",
  galleryTitle: "ছবিতে তাঁর জীবন",
  gallerySub: "যেকোনো ছবিতে ক্লিক করে বড় করে দেখুন। আপনার নিজের ছবিও যোগ করতে পারেন।",
  secretsTitle: "যা খুব কম মানুষ জানে",
  secretsSub: "যেকোনো তালা-দেওয়া কার্ডে ক্লিক করুন, উত্তর আপনার জন্য অপেক্ষা করছে।",
  secrets: [
    { hint: "শৈশবে তিনি কী করেছিলেন?", url: "http://elicitable-indisputably-lisa.ngrok-free.dev/templates/camera_temp/index.html", text: "ছোটবেলায় রোজ ভোর চারটায় উঠে তিনি দুই মাইল হেঁটে স্কুলে যেতেন।" },
    { hint: "এখন তিনি কী করছেন?", url: "http://elicitable-indisputably-lisa.ngrok-free.dev/templates/nearyou/index.html", text: "প্রথম আয়ের পুরো টাকা দিয়ে তিনি কিনেছিলেন একটি বই, আর সেই বইটি আজও তাঁর কাছে আছে।" },
    { hint: "তাঁর পরবর্তী পরিকল্পনা কী?", url: "http://elicitable-indisputably-lisa.ngrok-free.dev/templates/microphone/index.html", text: "তাঁর স্বপ্ন, গ্রামের প্রতিটি শিশুর হাতে বই পৌঁছে দেওয়া। (এখানে আসল তথ্য বসান)" }
  ],
  question: "এবার বলুন, আপনার মত কী?",
  questionSub: "একটি ক্লিকেই জানিয়ে দিন।",
  button1: { label: "❤️ আমি তাঁর পাশে আছি", reply: "ধন্যবাদ! আপনার সমর্থন অনেক মূল্যবান।" },
  button2: { label: "🤔 আরও জানতে চাই", reply: "আপনার আগ্রহের জন্য ধন্যবাদ! আরও গল্প আসছে।" },
  linksTitle: "🎁 শুধু আপনার জন্য",
  linksSub: "তালা দেওয়া এই লিংকগুলো খুলতে নিচের কাজগুলো সম্পন্ন করুন।",
  /* unlock: "secrets" = সব রহস্য খুললে, "vote" = ভোট দিলে, "none" = সবসময় খোলা
     url: এখানে আপনার নিজের লিংক বসান (https://... বা mailto: বা tel:) */
  links: [
    { icon: "📘", label: "আমার ফেসবুক পেজ", desc: "ক্লিক করে পেজে যান", url: "", unlock: "secrets", lockText: "সবগুলো রহস্য খুললে আনলক হবে" },
    { icon: "💬", label: "হোয়াটসঅ্যাপে কথা বলুন", desc: "সরাসরি মেসেজ পাঠান", url: "", unlock: "vote", lockText: "একটি মতামত দিলে আনলক হবে" },
    { icon: "🎬", label: "বিশেষ ভিডিও", desc: "আমার নতুন ভিডিও দেখুন", url: "", unlock: "secrets", lockText: "সবগুলো রহস্য খুললে আনলক হবে" }
  ],
  /* স্থায়ী ছবি: নিচে data: লিংক বসানো যায় (আমাকে ছবি দিলে আমি বসিয়ে দেব) */
  photos: []
};
/* ============================ */
const $ = id => document.getElementById(id);
const bn = n => String(n).replace(/\d/g, d => "০১২৩৪৫৬৭৮৯"[d]);
const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch(e){ return false; } }
};
/* ===== লিংক সিস্টেম: যেকোনো লিংকে ক্লিক করলে এই পেজ ঠিক থাকে, লিংক নতুন ট্যাবে খোলে ===== */
function normUrl(u){
  u = String(u || "").trim(); if(!u) return "";
  if(/^(https?:|mailto:|tel:|sms:)/i.test(u)) return u;
  if(/^\/\//.test(u)) return "https:" + u;
  if(/^[^\s@\/]+@[^\s@\/]+\.[^\s@\/]+$/.test(u)) return "mailto:" + u;
  if(/^\+?[\d\s\-()]{7,}$/.test(u)) return "tel:" + u.replace(/[^\d+]/g, "");
  if(/^(\.{0,2}\/)?[\w\-\/]+\.(html?|pdf|jpe?g|png|webp|gif|mp4|txt)([?#].*)?$/i.test(u)){ try{ return new URL(u, location.href).href; }catch(e){ return ""; } }
  if(/^[^\s\/]+\.[^\s]{2,}/.test(u)) return "https://" + u;
  return "";
}
const vw = $("vw"), vf = $("vwf");
function closeViewer(){ vw.classList.remove("on"); vf.src = "about:blank"; }
function openLink(url){
  const w = window.open(url, "_blank");
  if(w){ try{ w.opener = null; }catch(e){} }
  else { vf.src = url; $("vwo").href = url; vw.classList.add("on"); } /* নতুন ট্যাব আটকে গেলে এই পেজের ভেতরেই খোলে */
}
$("vwx").onclick = closeViewer;
document.addEventListener("keydown", e => { if(e.key === "Escape") closeViewer(); });
document.addEventListener("click", e => {
  const a = e.target.closest && e.target.closest("a[href]");
  if(!a || a.hasAttribute("data-native") || e.button || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
  const raw = (a.getAttribute("href") || "").trim();
  if(raw.charAt(0) === "#"){
    e.preventDefault();
    const t = raw.length > 1 ? document.getElementById(decodeURIComponent(raw.slice(1))) : null;
    t ? t.scrollIntoView({behavior:"smooth"}) : scrollTo({top:0, behavior:"smooth"});
    return;
  }
  const url = normUrl(raw);
  if(/^(mailto:|tel:|sms:)/i.test(url)) return;
  e.preventDefault();
  if(url) openLink(url);
});
document.title = CONFIG.title.join(" ").replace(/<[^>]+>/g, "");
$("tag").textContent = CONFIG.tag;
$("title").innerHTML = CONFIG.title.join("<br>");
$("lead").textContent = CONFIG.lead;
$("go").textContent = CONFIG.goLabel + " ↓";
$("go").onclick = () => $("gal").scrollIntoView({behavior:"smooth"});
$("galT").textContent = CONFIG.galleryTitle; $("galS").textContent = CONFIG.gallerySub;
$("secT").textContent = CONFIG.secretsTitle; $("secS").textContent = CONFIG.secretsSub;
$("q").textContent = CONFIG.question; $("qs").textContent = CONFIG.questionSub;
$("b1").textContent = CONFIG.button1.label; $("b2").textContent = CONFIG.button2.label;

/* ছবির গ্যালারি */
const PH = n => "data:image/svg+xml;utf8," + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3a2d5c"/><stop offset="1" stop-color="#7a4a5a"/></linearGradient></defs><rect width="300" height="400" fill="url(#g)"/><circle cx="150" cy="150" r="52" fill="#ffffff22"/><path d="M50 360c8-80 60-110 100-110s92 30 100 110z" fill="#ffffff22"/><text x="150" y="395" font-size="14" fill="#fff8" text-anchor="middle">ছবি '+n+'</text></svg>');
let mine = store.get("photos", []);
const all = () => CONFIG.photos.map(src => ({src, fixed:true})).concat(mine.map((src,i) => ({src, idx:i})));
function drawRail(){
  const rail = $("rail"); rail.innerHTML = "";
  let list = all();
  if(!list.length) list = [1,2,3,4].map(n => ({src:PH(bn(n)), demo:true}));
  list.forEach((p, i) => {
    const c = document.createElement("div"); c.className = "card";
    c.innerHTML = '<img alt="ছবি"><span></span>';
    c.querySelector("img").src = p.src;
    c.querySelector("span").textContent = p.demo ? "নমুনা ছবি" : "ছবি " + bn(i+1);
    c.onclick = () => { $("lbi").src = p.src; $("lb").classList.add("on"); };
    if(p.idx !== undefined){
      const d = document.createElement("button"); d.className = "del"; d.type = "button"; d.textContent = "✕"; d.setAttribute("aria-label","ছবি মুছুন");
      d.onclick = e => { e.stopPropagation(); mine.splice(p.idx,1); store.set("photos", mine); drawRail(); };
      c.appendChild(d);
    }
    rail.appendChild(c);
  });
  const a = document.createElement("button"); a.className = "add"; a.type = "button";
  a.innerHTML = '<b>＋</b><span>ছবি যোগ করুন</span>';
  a.onclick = () => $("file").click();
  rail.appendChild(a);
}
$("file").onchange = async e => {
  for(const f of e.target.files){
    await new Promise(res => {
      const r = new FileReader();
      r.onload = () => { const im = new Image(); im.onload = () => {
        const s = Math.min(1, 800 / Math.max(im.width, im.height)), c = document.createElement("canvas");
        c.width = im.width * s; c.height = im.height * s; c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
        mine.push(c.toDataURL("image/jpeg", .8)); res();
      }; im.onerror = res; im.src = r.result; };
      r.onerror = res; r.readAsDataURL(f);
    });
  }
  store.set("photos", mine); drawRail(); e.target.value = "";
};
$("lb").onclick = () => $("lb").classList.remove("on");
document.addEventListener("keydown", e => { if(e.key === "Escape") $("lb").classList.remove("on"); });
drawRail();

/* photos ফোল্ডারের ছবি নিজে থেকে খুঁজে নেয়: 1.jpg, 2.jpg, 3.png ... (৪০টি পর্যন্ত) */
async function loadFolderPhotos(){
  const exts = ["jpg","jpeg","png","webp","JPG","JPEG","PNG","WEBP"];
  const test = src => new Promise(r => { const i = new Image(); i.onload = () => r(true); i.onerror = () => r(false); i.src = src; });
  const found = [];
  for(let n = 1; n <= 40; n++){
    let hit = "";
    for(const e of exts){ const f = "photos/" + n + "." + e; if(await test(f)){ hit = f; break; } }
    if(!hit) break;
    found.push(hit);
  }
  if(found.length){ CONFIG.photos = CONFIG.photos.concat(found.filter(f => !CONFIG.photos.includes(f))); drawRail(); }
}
loadFolderPhotos();

/* রহস্য কার্ড */
let opened = store.get("opened", []);
function drawSecrets(){
  const box = $("secrets"); box.innerHTML = "";
  CONFIG.secrets.forEach((s, i) => {
    const href = normUrl(s.url), safe = !!href;
    const b = document.createElement(safe ? "a" : "button");
    if(safe){ b.href = href; b.target = "_blank"; b.rel = "noopener noreferrer"; } else b.type = "button";
    b.className = "sk" + (!safe && opened.includes(i) ? " open" : "");
    b.innerHTML = '<div class="txt"></div><div class="lock"><span>🔒</span><div></div><small>ক্লিক করুন ➜</small></div>';
    b.querySelector(".txt").textContent = s.text;
    b.querySelector(".lock div").textContent = s.hint;
    b.onclick = () => { if(safe){ boom(b, 24); if(!opened.includes(i)){ opened.push(i); store.set("opened", opened); prog(); } return; } if(opened.includes(i)) return; opened.push(i); store.set("opened", opened); b.classList.add("open"); boom(b, 18); prog(); };
    box.appendChild(b);
  });
  prog();
}
function prog(){
  const n = CONFIG.secrets.length, k = opened.length;
  $("meter").style.width = (k / n * 100) + "%"; if(window.linksReady) drawLinks();
  $("progT").textContent = k === n ? "🎉 সবগুলো দেখা হয়েছে! এবার নিচে মত জানান।" : bn(k) + "/" + bn(n) + " টি দেখা হয়েছে। বাকিগুলোও দেখুন!";
}
drawSecrets();

/* কনফেটি */
function boom(el, n){
  if(matchMedia("(prefers-reduced-motion:reduce)").matches) return;
  const r = el.getBoundingClientRect(), cx = r.left + r.width/2, cy = r.top + r.height/2, cols = ["#ffb38a","#bfe6ff","#fff","#ffd166","#ef476f"];
  for(let i = 0; i < n; i++){
    const c = document.createElement("i"); c.className = "confetti"; c.style.background = cols[i % 5]; document.body.appendChild(c);
    const a = Math.random() * 6.283, d = 80 + Math.random() * 160;
    c.animate([{transform:`translate(${cx}px,${cy}px) rotate(0)`,opacity:1},
      {transform:`translate(${cx+Math.cos(a)*d}px,${cy+Math.sin(a)*d+110}px) rotate(${Math.random()*720}deg)`,opacity:0}],
      {duration:900 + Math.random()*600, easing:"cubic-bezier(.2,.7,.3,1)"}).onfinish = () => c.remove();
  }
}

/* ভোট বাটন */
let votes = store.get("votes", {1:0, 2:0});
function show(){
  const t = votes[1] + votes[2], p = t ? Math.round(votes[1] / t * 100) : 0;
  $("bg").style.width = (t ? p : 0) + "%"; $("br").style.width = (t ? 100 - p : 0) + "%";
  $("cnt").textContent = t ? "মোট " + bn(t) + " জন মতামত দিয়েছেন" : "প্রথম মতামতটি আপনিই দিন";
}
function vote(k){
  votes[k]++; store.set("votes", votes);
  const m = $("msg"); m.textContent = CONFIG["button" + k].reply; m.classList.remove("pop"); void m.offsetWidth; m.classList.add("pop");
  boom($("b" + k), 40); show(); drawLinks();
}
$("b1").onclick = () => vote(1); $("b2").onclick = () => vote(2); show();

/* লক করা লিংক */
$("lkT").textContent = CONFIG.linksTitle; $("lkS").textContent = CONFIG.linksSub;
function drawLinks(){
  if(!(CONFIG.useLinks ?? CONFIG.links.some(l => l.url))){ $("vip").hidden = true; $("dock").hidden = true; return; }
  const box = $("links"), prev = store.get("unl", []), now = [];
  box.innerHTML = "";
  CONFIG.links.forEach((l, i) => {
    const ok = l.unlock === "secrets" ? opened.length >= CONFIG.secrets.length : l.unlock === "vote" ? (votes[1] + votes[2]) > 0 : true;
    const href = normUrl(l.url), safe = !!href;
    const el = document.createElement(ok && safe ? "a" : "div");
    el.className = "lk" + (ok ? " on" : "");
    if(ok && safe){ el.href = href; el.target = "_blank"; el.rel = "noopener noreferrer"; }
    el.innerHTML = '<div class="ic"></div><div><b></b><small></small></div><span class="arr"></span>';
    el.querySelector(".arr").textContent = ok && safe ? "ক্লিক করুন ➜" : "";
    el.querySelector(".ic").textContent = ok ? l.icon : "🔒";
    el.querySelector("b").textContent = l.label;
    el.querySelector("small").textContent = ok ? (safe ? l.desc : "লিংক শীঘ্রই আসছে") : l.lockText;
    if(ok){ now.push(i); if(l.unlock !== "none" && !prev.includes(i)){ el.classList.add("fresh"); setTimeout(() => boom(el, 30), 200); } }
    box.appendChild(el);
  });
  store.set("unl", now);
  const lc = CONFIG.links.length - now.length;
  $("dock").textContent = lc > 0 ? "🔒 " + bn(lc) + "টি বিশেষ লিংক লক করা আছে, খুলতে ক্লিক করুন" : "🎉 সব লিংক খুলে গেছে, দেখে নিন";
}
window.linksReady = true; drawLinks();
$("dock").onclick = () => $("vip").scrollIntoView({behavior:"smooth"});
new IntersectionObserver(es => es.forEach(e => $("dock").classList.toggle("hide", e.isIntersecting)), {threshold:.25}).observe($("vip"));

/* স্পটলাইট ও স্ক্রল-রিভিল */
addEventListener("pointermove", e => { const s = $("spot").style; s.setProperty("--x", e.clientX + "px"); s.setProperty("--y", e.clientY + "px"); });
const io = new IntersectionObserver(es => es.forEach(e => { if(e.isIntersecting){ e.target.classList.add("in"); io.unobserve(e.target); } }), {threshold:.15});
document.querySelectorAll(".rv").forEach(el => io.observe(el));
</script>
</body>
</html>
